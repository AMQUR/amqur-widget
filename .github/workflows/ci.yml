name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - 'audit/**'
      - 'feature/**'
      - 'ops/**'
      - 'production-readiness/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: widget-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Record tested SHA
        run: |
          echo "repository=${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "event=${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "pr=${{ github.event.pull_request.number || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "run_id=${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: IIFE inspection
        run: |
          set -euo pipefail
          test -f dist/assistant-widget.iife.js
          head -c 40 dist/assistant-widget.iife.js | grep -q 'AmqurWidgetBundle'
          if head -c 80 dist/assistant-widget.iife.js | grep -q 'var AMQUR='; then
            echo "IIFE overwrites window.AMQUR — refuse" >&2
            exit 1
          fi
          if rg -n 'JWT_SECRET|DATABASE_URL|BOOTSTRAP_SECRET|TEKION_CLIENT_SECRET|sk-ant-|BEGIN PRIVATE KEY' dist/assistant-widget.iife.js; then
            echo "IIFE secret scan FAILED" >&2
            exit 1
          fi
          echo "IIFE inspection PASSED"

      - name: Secret scan (tracked)
        run: |
          set -euo pipefail
          # Filter paths before rg — --glob is ignored when file paths are passed via xargs.
          hits=$(git ls-files -z \
            | grep -z -v -E '^(\.github/workflows/|docs/|e2e/|\.env[^/]*\.example$)' \
            | xargs -0 -r rg -l --ignore-case \
              -e 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
              -e 'AMQUR_API_KEY=[A-Za-z0-9_-]{20,}' \
              -e 'sk_live_[A-Za-z0-9]{20,}' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Potential secret in tracked files" >&2
            exit 1
          fi
          echo "Secret scan PASSED"

      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit || true

      - name: Write CI head receipt
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## CI receipt
          - tested_sha: ${{ github.sha }}
          - run_id: ${{ github.run_id }}
          - run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

  staging-e2e:
    # On-demand full browser matrix (Chromium/Firefox/WebKit + mobile
    # viewports + a11y) against the staging widget host. Manual because it
    # exercises live staging; run before any pilot go/no-go.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run staging browser matrix
        env:
          STAGING_WIDGET_URL: https://staging-widget.dialusnow.com
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-playwright-report
          path: playwright-report/
          retention-days: 14
