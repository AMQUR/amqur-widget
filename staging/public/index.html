<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AMQUR Staging — NOT FOR CUSTOMERS</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .banner { background: #b45309; color: #fff; padding: 12px 16px; font-weight: 700; letter-spacing: 0.02em; }
    .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="banner">STAGING — NOT FOR CUSTOMERS</div>
  <div class="wrap">
    <h1>AMQUR Staging Pilot Host</h1>
    <p>Tenant: <code>dial-auto-group-staging</code> · Rooftop: <code>pilot-rooftop</code></p>
    <p>Fixture inventory only. Tekion, live vAuto, automated follow-up, and voice remain disabled.</p>
  </div>
  <script src="./amqur-widget.iife.js"></script>
  <script>
    (function () {
      var api = window.AMQUR;
      if (!api || typeof api.init !== "function") {
        console.error("[AMQUR staging] widget API missing after IIFE load", api);
        return;
      }
      api.init({
        apiBaseUrl: "https://backend-staging-staging-b699.up.railway.app/api",
        tenantSlug: "dial-auto-group-staging",
        locationSlug: "pilot-rooftop",
        locale: "en",
      });
    })();
  </script>
</body>
</html>
