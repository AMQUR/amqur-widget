<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Dial Us Now — Staging Widget Host</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .banner { background: #b45309; color: #fff; padding: 12px 16px; font-weight: 700; letter-spacing: 0.02em; }
    .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    select, button { margin-top: 6px; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
    button { cursor: pointer; background: #0369a1; border-color: #0284c7; }
  </style>
</head>
<body>
  <div class="banner">STAGING — NOT FOR CUSTOMERS</div>
  <div class="wrap">
    <h1>Dial Us Now staging host</h1>
    <p>Public bundle: <code>/assistant-widget.iife.js</code> · API: <code>window.AMQUR.init</code></p>
    <p>Dealership branding/origins come from tenant config only. Inventory/payments remain fail-closed until verified.</p>
    <label for="tenant">Tenant slug</label>
    <select id="tenant">
      <option value="jeep-of-chicago">jeep-of-chicago</option>
      <option value="dial-nissan-of-chicago">dial-nissan-of-chicago</option>
      <option value="dial-chevy-of-chicago">dial-chevy-of-chicago</option>
      <option value="infiniti-of-chicago">infiniti-of-chicago</option>
      <option value="dial-cdjr-of-chicago">dial-cdjr-of-chicago</option>
    </select>
    <p><button type="button" id="boot">Load assistant</button></p>
  </div>
  <script src="./assistant-widget.iife.js"></script>
  <script>
    (function () {
      var apiBase =
        window.__AMQUR_API_BASE__ ||
        "https://staging-api.dialusnow.com/api";
      document.getElementById("boot").addEventListener("click", function () {
        var api = window.AMQUR;
        if (!api || typeof api.init !== "function") {
          console.error("[staging] widget API missing after IIFE load", api);
          return;
        }
        var tenant = document.getElementById("tenant").value;
        api.init({
          apiBaseUrl: apiBase,
          tenantSlug: tenant,
          locationSlug: "main",
          locale: "en",
        });
      });
    })();
  </script>
</body>
</html>
