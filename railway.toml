[build]
builder = "DOCKERFILE"
# Staging is GitHub-connected and reads railway.toml directly on each PR push.
# Keep the employee-only staging image as the default to prevent unsafe staging
# HTML from losing its banner during direct GitHub-connected deploys.
# Production GitHub Actions MUST explicitly switch to Dockerfile before railway up.
# Direct GitHub-connected production deployment must NOT use this shared config.
dockerfilePath = "Dockerfile.staging"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
