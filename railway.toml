[build]
builder = "DOCKERFILE"
# Safe shared-repository default: production CDN image, never staging canary HTML.
# Staging Deploy workflow switches to Dockerfile.staging immediately before railway up.
# Railway-connected STAGING service must override Dockerfile path explicitly if bypassing Actions.
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
